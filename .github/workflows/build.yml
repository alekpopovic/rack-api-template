name: Publish image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag" >&2
            exit 1
          fi
      - name: Validate application
        run: bundle exec rake
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
      - name: Build image
        run: docker build --pull --build-arg RUBY_VERSION="$(cat .ruby-version)" -t "popac/rack-api:$RELEASE_TAG" .
      - name: Verify production image
        run: bundle exec ./bin/smoke-image "popac/rack-api:$RELEASE_TAG"
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image
        run: docker push "popac/rack-api:$RELEASE_TAG"
