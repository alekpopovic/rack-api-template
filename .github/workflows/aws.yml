name: AWS Docker Build

on:
  push:
    branches:
      - main

jobs:
  dev_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push the image to Amazon ECR
        id: build-image
        run: |
          docker build -t rack-api:${{ github.sha }} .
          docker tag rack-api:${{ github.sha }} 057373359136.dkr.ecr.eu-west-1.amazonaws.com/rack-api:${{ github.sha }}
          docker push 057373359136.dkr.ecr.eu-west-1.amazonaws.com/rack-api:${{ github.sha }}
          docker tag rack-api:${{ github.sha }} 057373359136.dkr.ecr.eu-west-1.amazonaws.com/rack-api:latest
          docker push 057373359136.dkr.ecr.eu-west-1.amazonaws.com/rack-api:latest