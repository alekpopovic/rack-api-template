name: Development build
on:
  push:
    branches: ["development"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.2.2"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run lint
        run: bundle exec rubocop
      - name: Run tests
        run: bundle exec rspec
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image
        run: docker build -t rack-api-development:${{ github.sha }} .
      - name: Tag image
        run: docker tag rack-api-development:${{ github.sha }} popac/rack-api-development:${{ github.sha }}
      - name: Push image to container registry
        run: docker push popac/rack-api-development:${{ github.sha }}
      - name: Update image tag
        id: update-image-tag
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '.image.tag = "${{ github.sha }}"' -i k8s/development/values.yaml
      - name: Update app version
        id: update-app-version
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '.appVersion = "${{ github.sha }}"' -i k8s/development/Chart.yaml
      - name: Commit app version and docker tag
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Setup app version && docker tag to ${{ github.sha }}
