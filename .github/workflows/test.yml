name: Test, lint && build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: [
      "main",
      "development",
      "staging",
      "production"
    ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.3.0"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run lint
        run: bundle exec rubocop
      - name: Run tests
        run: bundle exec rspec
      - name: Run test build
        run: docker build -t test-build:${{ github.sha }} .
