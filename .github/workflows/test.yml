name: Test, lint and build
on:
  push:
    branches: [development, staging, production]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - name: Load application classes
        run: bundle exec ./bin/check
      - name: Lint
        run: bundle exec rubocop
      - name: Unit and request tests
        run: bundle exec rspec
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
      - name: Build production image
        run: docker build --pull --build-arg RUBY_VERSION="$(cat .ruby-version)" -t rack-api:test .
      - name: Production API, Redis and Sidekiq integration
        run: bundle exec ./bin/smoke-image rack-api:test
